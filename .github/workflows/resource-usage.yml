name: Resource usage

# Keeps a "how close am I to the limit" block at the top of README.md, so the
# repository front page answers it without anyone running a command.
#
# Two of the numbers come from the GitHub API rather than the working tree,
# because those are the ones GitHub enforces: the published Pages artifact and
# the repository size as GitHub counts it. Every measurement is appended to
# data/resource-usage.jsonl, which is what lets the block report a measured
# growth rate and a projected runway instead of a guess.

on:
  workflow_dispatch:
  schedule:
    # Mondays 04:00 UTC. Weekly is enough: the runway is measured in months.
    - cron: '0 4 * * 1'

permissions:
  contents: write

concurrency:
  group: media-maintenance
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the report script
        run: python -m unittest discover -s tests -p 'test_report_resource_usage.py'

      - name: Measure and update the README block
        run: python scripts/report_resource_usage.py --write

      - name: Commit when the numbers moved
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/resource-usage.jsonl
          if git diff --cached --quiet; then
            echo "Nothing to report"
            exit 0
          fi
          git commit -m 'chore: refresh the resource usage block'
          # All automated archive writers share this concurrency group.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "Unable to push the resource usage block" >&2
          exit 1
