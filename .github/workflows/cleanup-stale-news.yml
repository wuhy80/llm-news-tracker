name: Clean up stale news items

# Two kinds of history no longer match the rules, and they need opposite
# treatment. Items from sources that were removed are dropped; the four Bing News
# searches are matched by sourceDomain, which stayed bing.com even though the
# embedded-source feature rewrote the publisher name. Forum titles over the
# 120-character cap are trimmed with the same helper the ingest path uses.
#
# Old but readable articles are deliberately kept: the feed cutoff stops the back
# catalogue being re-imported, it does not say history should be deleted.
#
# Only the daily shards are rewritten. The next update-news run rebuilds the
# manifest and the locator shards from them and prunes the orphaned snapshots.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the cleanup (leave unchecked to report only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: media-maintenance
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APPLY: ${{ inputs.apply || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the cleanup script
        run: python -m unittest discover -s tests -p 'test_cleanup_stale_news.py'

      - name: Report or apply the cleanup
        run: |
          if [ "$APPLY" = "true" ]; then
            python scripts/cleanup_stale_news.py --apply
          else
            python scripts/cleanup_stale_news.py
          fi

      - name: Commit the cleaned shards
        if: ${{ inputs.apply }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/news
          if git diff --cached --quiet; then
            echo "Nothing to clean"
            exit 0
          fi
          git commit -m 'chore: drop items from removed sources and trim forum titles'
          # All automated archive writers share this concurrency group.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "Unable to push the cleaned shards" >&2
          exit 1
