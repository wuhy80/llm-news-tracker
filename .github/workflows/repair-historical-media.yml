name: Repair historical article media

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-historical-media.yml
      - scripts/media_layout.py
      - scripts/huggingface_content.py
      - scripts/repair_huggingface.py
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum snapshots per batch
        default: '1000'
      workers:
        description: Concurrent source fetches
        default: '8'

permissions:
  contents: write

concurrency:
  group: archive-writes
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      # Article media is served from an object store once these exist. Until
      # then it stays committed, so the published site never loses images.
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test media repair
        run: |
          python -m unittest discover -s tests -p '*media*.py'
          node tests/test_media_layout.js
          python -m unittest discover -s tests -p 'test_huggingface_content.py'
          node tests/test_inline_content.js
      - name: Repair all Hugging Face archive years
        run: python scripts/repair_huggingface.py --limit 80
      - name: Repair all archive years
        env:
          ARTICLE_MEDIA_BACKFILL_LIMIT: ${{ inputs.limit || '1000' }}
          ARTICLE_MEDIA_BACKFILL_WORKERS: ${{ inputs.workers || '8' }}
        run: python scripts/backfill_article_media.py --all-snapshots --retry-days 7
      - name: Restore historical media positions
        env:
          ARTICLE_LAYOUT_READER_LIMIT: '10'
        run: python scripts/backfill_article_media.py --layout --limit 100 --workers 4 --retry-days 7
      # Media bytes belong in the object store, not in git history. Skipped
      # until the R2 secrets exist, so adding this step changes nothing today.
      - name: Sync article media to R2
        if: ${{ env.R2_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          aws --version
          aws s3 sync data/article-media "s3://${R2_BUCKET}/" \
            --endpoint-url "$R2_ENDPOINT" --region auto --only-show-errors

      - name: Commit repaired snapshots and retry progress
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/validate_translations.py
          # Keep media in the repository until an external store is configured.
          media="data/article-media"
          if [ -n "$R2_BUCKET" ]; then media=""; fi
          git add data/articles data/news $media data/media-repair-state.json data/media-layout-state.json data/huggingface-repair-state.json data/translations/zh-CN data/translations/index.json data/translations/progress.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: repair historical article images and videos'
          # All automated archive writers use archive-writes concurrency.
          # On unrelated new commits, rebase without overwriting concurrent edits.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
