name: GIF transcode report

# Reports what the referenced GIFs would cost as MP4, by actually transcoding
# them into a temporary directory and measuring the result.
#
# Read-only: it never writes to the repository, so it is safe to run at any time.
# Acting on the numbers (converting the archive) would be a separate change.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only the N largest GIFs (0 = all)"
        type: string
        default: "0"

permissions:
  contents: read

concurrency:
  group: gif-transcode-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the report script
        run: python -m unittest discover -s tests -p 'test_transcode_gif_report.py'

      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Report GIF transcoding potential
        env:
          LIMIT: ${{ inputs.limit || '0' }}
        run: |
          if [ -z "$LIMIT" ] || [ "$LIMIT" = "0" ]; then
            python scripts/transcode_gif_report.py
          else
            python scripts/transcode_gif_report.py --limit "$LIMIT"
          fi
