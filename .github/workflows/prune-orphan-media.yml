name: Prune orphan article media

# Article media files are named after a hash of their source URL. Earlier
# extraction cycles wrote far more of them than the snapshots reference today,
# and those leftovers dominate both the file count and the byte count.
#
# Nothing is deleted unless the apply input is checked. Deletion only touches
# the working tree - the bytes stay in git history, so a bad run is recoverable.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Delete the orphans (leave unchecked to report only)"
        type: boolean
        default: false
  schedule:
    # Weekly safety net. A scheduled run carries no inputs, so apply stays false
    # and the run only reports - deleting stays a deliberate, human act.
    # UTC 04:37 Monday = Asia/Shanghai 12:37 Monday.
    - cron: '37 4 * * 1'

permissions:
  contents: write

concurrency:
  # Deliberately not the shared archive-writes group: a run still pending there
  # is cancelled as soon as the every-five-minute translation job queues another
  # run, so a manual dispatch could never start. These maintenance jobs are rare
  # and their commit steps already rebase and retry against a moving main.
  group: media-maintenance
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APPLY: ${{ inputs.apply || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the pruning script
        run: python -m unittest discover -s tests -p 'test_prune_orphan_media.py'

      - name: Report or delete orphan media
        run: |
          if [ "$APPLY" = "true" ]; then
            python scripts/prune_orphan_media.py --apply
          else
            python scripts/prune_orphan_media.py
          fi

      - name: Commit the pruned media
        if: ${{ inputs.apply }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/article-media
          if git diff --cached --quiet; then
            echo "Nothing to prune"
            exit 0
          fi
          git commit -m 'chore: prune unreferenced article media'
          # All automated archive writers share this concurrency group.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "Unable to push the pruned media" >&2
          exit 1
