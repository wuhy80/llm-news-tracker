name: Probe nowcoding relay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe the relay
        env:
          NOWCODING_API_KEY: ${{ secrets.NOWCODING_API_KEY }}
        run: |
          python - <<'PYCODE'
          import json, os, sys, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          sys.path.insert(0, 'scripts')
          from translate_articles import SYSTEM_PROMPT
          token = os.environ['NOWCODING_API_KEY'].strip()
          endpoint = 'https://nowcoding.ai/v1/chat/completions'
          paragraphs = [
              "The retry budget is 3 requests, not 30. HTTP 429 does not mean the API key is invalid.",
              "Keep /data/models unchanged. Run kubectl get pods before restarting Kubernetes. Documentation: https://example.com/guide",
              "In this experiment, batching reduced latency by 25%, but increased memory use. This result does not prove that every workload is faster.",
              "Agents that store long-term memory must score relevance before retrieval; otherwise the context window fills with stale notes and the model loses the thread of the task.",
              "A benchmark without a holdout set measures memorization, not generalization; report both numbers or neither.",
              "The scheduler preempts low-priority pods when the node pressures memory, which is why the eviction rate spikes at dawn.",
              "Rate limiting protects the upstream, but the client also needs exponential backoff with jitter to avoid synchronized retries.",
              "When the API returns 529, the provider is overloaded; treat it as transient and do not disable the model.",
          ]
          blocks = [{'id': f'b{i+1:04d}', 'kind': 'paragraph', 'source': t} for i, t in enumerate(paragraphs)]

          def ask(nblocks, label):
              payload = {'model': 'gpt-6.1-sol', 'messages': [
                  {'role': 'system', 'content': SYSTEM_PROMPT},
                  {'role': 'user', 'content': json.dumps({'blocks': blocks[:nblocks]}, ensure_ascii=False)}],
                  'temperature': 0, 'max_tokens': 8000,
                  'provider': {'max_price': {'prompt': 0, 'completion': 0}}}
              req = urllib.request.Request(endpoint, data=json.dumps(payload, ensure_ascii=False).encode('utf-8'),
                  method='POST', headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json',
                  'Accept': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      body = json.loads(r.read().decode('utf-8'))
                  choice = body['choices'][0]
                  msg = choice.get('message') or {}
                  content = msg.get('content') or ''
                  reasoning = msg.get('reasoning_content') or msg.get('reasoning') or ''
                  print(f'--- {label}: model={body.get("model")} finish={choice.get("finish_reason")}')
                  print(f'    usage={body.get("usage")}')
                  print(f'    content_chars={len(content)} reasoning_chars={len(reasoning) if reasoning else 0}')
                  print(f'    content[:400]={content[:400]!r}')
              except urllib.error.HTTPError as e:
                  print(f'--- {label}: HTTP {e.code}: {e.read()[:300]!r}')
              except Exception as e:
                  print(f'--- {label}: {type(e).__name__}: {e}')

          ask(1, 'small single       ')
          ask(8, 'production single  ')
          with ThreadPoolExecutor(max_workers=3) as ex:
              list(ex.map(lambda i: ask(8, f'concurrent #{i+1}   '), range(3)))
          PYCODE
