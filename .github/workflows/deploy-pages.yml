name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["Update news", "Translate important articles", "Repair historical article media"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate static assets
        shell: bash
        run: |
          for asset in assets/*.css; do
            if ! grep -Iq . "$asset"; then
              echo "::error file=$asset::CSS asset is not plain text"
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build global translation progress
        run: |
          python -m unittest discover -s tests -p 'test_translation_progress.py'
          python scripts/build_translation_progress.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

