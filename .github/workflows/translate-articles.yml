name: Translate important articles

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/translate_articles.py"
      - "scripts/validate_translations.py"
      - "tests/test_translate_articles.py"
      - "tests/test_validate_translations.py"
      - ".github/workflows/translate-articles.yml"
  schedule:
    # One request every 30 minutes: 48 scheduled opportunities per UTC day.
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      request_limit:
        description: "Maximum OpenRouter requests in this run"
        required: false
        default: "1"
      daily_limit:
        description: "Conservative UTC daily request budget"
        required: false
        default: "50"
      interval_seconds:
        description: "Minimum delay between OpenRouter requests"
        required: false
        default: "30"
      model:
        description: "OpenRouter model or free router"
        required: false
        default: "openrouter/free"

permissions:
  contents: write

concurrency:
  group: archive-writes
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test translation pipeline
        run: python -m unittest tests.test_translate_articles tests.test_validate_translations

      - name: Translate important articles incrementally
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ARTICLE_TRANSLATION_MODEL: ${{ inputs.model || vars.ARTICLE_TRANSLATION_MODEL || 'openrouter/free' }}
          ARTICLE_TRANSLATION_REQUEST_LIMIT: ${{ inputs.request_limit || '1' }}
          ARTICLE_TRANSLATION_DAILY_LIMIT: ${{ inputs.daily_limit || '50' }}
          ARTICLE_TRANSLATION_INTERVAL: ${{ inputs.interval_seconds || '30' }}
          ARTICLE_TRANSLATION_CHUNK_CHARS: "6000"
          ARTICLE_TRANSLATION_CHUNK_BLOCKS: "20"
        run: python scripts/translate_articles.py

      - name: Validate translation sidecars
        run: python scripts/validate_translations.py

      - name: Commit translation progress
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/translations 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: translate important articles"
          git push
