name: Translate important articles

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/translate_articles.py"
      - "scripts/translation_queue.py"
      - "scripts/translation_models.py"
      - "scripts/api_rate_control.py"
      - "scripts/provider_limits.py"
      - "scripts/continue_translation.py"
      - "tests/test_groq_recovery.py"
      - "scripts/provider_routing.py"
      - "tests/test_provider_routing.py"
      - "tests/test_api_rate_control.py"
      - "tests/test_translation_models.py"
      - "tests/test_translation_resilience.py"
      - "tests/test_translation_parallel.py"
      - "tests/test_translation_queue.py"
      - "scripts/validate_translations.py"
      - "tests/test_translate_articles.py"
      - "tests/test_validate_translations.py"
      - ".github/workflows/translate-articles.yml"
  workflow_run:
    workflows: ["Update news"]
    types: [completed]
  issues:
    types: [opened, reopened, edited]
  schedule:
    # Keep retrying frequently so the purchased free-model quota is usable even
    # when GitHub delays individual scheduled runs.
    # The script stops at the configured 1,000-request daily budget.
    - cron: "2-57/5 * * * *"
    # Daily evaluation is guarded by the Shanghai date in the worker. Any later
    # run catches up if GitHub delays this 07:17 Asia/Shanghai schedule.
    - cron: "17 23 * * *"
  workflow_dispatch:
    inputs:
      continuation_depth:
        description: "Internal bounded continuation counter (0-3)"
        required: false
        default: "0"
      request_limit:
        description: "Maximum OpenRouter requests in this run"
        required: false
        default: "48"
      daily_limit:
        description: "UTC daily request budget for the purchased free-model tier"
        required: false
        default: "1000"
      interval_seconds:
        description: "Minimum delay between OpenRouter requests"
        required: false
        default: "5"
      model:
        description: "OpenRouter model or free router"
        required: false
        default: "qwen/qwen3.8-27b:free"

permissions:
  contents: write
  actions: write
  issues: read

concurrency:
  group: archive-writes
  cancel-in-progress: false

jobs:
  translate:
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main') && (github.event_name != 'issues' || (startsWith(github.event.issue.title, '[优先翻译] ') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test translation pipeline
        run: |
          python -m unittest tests.test_translate_articles tests.test_validate_translations
          python -m unittest discover -s tests -p test_translation_queue.py
          python -m unittest discover -s tests -p test_translation_models.py
          python -m unittest discover -s tests -p test_translation_resilience.py
          python -m unittest discover -s tests -p test_translation_parallel.py
          python -m unittest discover -s tests -p test_api_rate_control.py
          python -m unittest discover -s tests -p test_provider_routing.py
          python -m unittest discover -s tests -p test_groq_recovery.py

      - name: Evaluate free translation providers once per day
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ github.token }}
          BIGMODEL_API_KEY: ${{ secrets.BIGMODEL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Gemini defaults are conservative pilot caps, not account entitlements.
          # Set these vars from AI Studio's project/model limits; code reserves 25%.
          GEMINI_RPM: ${{ vars.GEMINI_RPM || '1' }}
          GEMINI_TPM: ${{ vars.GEMINI_TPM || '8000' }}
          GEMINI_RPD: ${{ vars.GEMINI_RPD || '8' }}
          GROQ_TRANSLATION_REQUEST_LIMIT: ${{ vars.GROQ_TRANSLATION_REQUEST_LIMIT || '48' }}
          GROQ_TRANSLATION_RUN_SECONDS: ${{ vars.GROQ_TRANSLATION_RUN_SECONDS || '1200' }}
          GROQ_RPM: ${{ vars.GROQ_RPM || '30' }}
          GROQ_TPM: ${{ vars.GROQ_TPM || '8000' }}
          GROQ_RPD: ${{ vars.GROQ_RPD || '1000' }}
          GROQ_TPD: ${{ vars.GROQ_TPD || '200000' }}
          BIGMODEL_TRANSLATION_REQUEST_LIMIT: ${{ vars.BIGMODEL_TRANSLATION_REQUEST_LIMIT || '8' }}
          BIGMODEL_TRANSLATION_DAILY_LIMIT: ${{ vars.BIGMODEL_TRANSLATION_DAILY_LIMIT || '1000' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Prefer a capable multilingual model instead of the random free router.
          # The live zero-price catalog and persisted health override retired models.
          ARTICLE_TRANSLATION_MODEL: ${{ inputs.model || vars.ARTICLE_TRANSLATION_MODEL || 'qwen/qwen3.8-27b:free' }}
          ARTICLE_TRANSLATION_REQUEST_LIMIT: ${{ inputs.request_limit || '48' }}
          ARTICLE_TRANSLATION_DAILY_LIMIT: ${{ inputs.daily_limit || '1000' }}
          ARTICLE_TRANSLATION_INTERVAL: ${{ inputs.interval_seconds || '5' }}
          # Smaller responses are much more reliable on free models. The previous
          # 20-block batches frequently returned English or malformed/truncated JSON.
          ARTICLE_TRANSLATION_CHUNK_CHARS: "3500"
          ARTICLE_TRANSLATION_CHUNK_BLOCKS: "8"
        run: python scripts/translate_articles.py --evaluate-only


      - name: Persist evaluation and consumed quota before bulk translation
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/translations
          git diff --cached --quiet || git commit -m "chore: record daily provider evaluation"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1

      - name: Translate important articles incrementally
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ github.token }}
          BIGMODEL_API_KEY: ${{ secrets.BIGMODEL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Gemini defaults are conservative pilot caps, not account entitlements.
          # Set these vars from AI Studio's project/model limits; code reserves 25%.
          GEMINI_RPM: ${{ vars.GEMINI_RPM || '1' }}
          GEMINI_TPM: ${{ vars.GEMINI_TPM || '8000' }}
          GEMINI_RPD: ${{ vars.GEMINI_RPD || '8' }}
          GROQ_TRANSLATION_REQUEST_LIMIT: ${{ vars.GROQ_TRANSLATION_REQUEST_LIMIT || '48' }}
          GROQ_TRANSLATION_RUN_SECONDS: ${{ vars.GROQ_TRANSLATION_RUN_SECONDS || '1200' }}
          GROQ_RPM: ${{ vars.GROQ_RPM || '30' }}
          GROQ_TPM: ${{ vars.GROQ_TPM || '8000' }}
          GROQ_RPD: ${{ vars.GROQ_RPD || '1000' }}
          GROQ_TPD: ${{ vars.GROQ_TPD || '200000' }}
          BIGMODEL_TRANSLATION_REQUEST_LIMIT: ${{ vars.BIGMODEL_TRANSLATION_REQUEST_LIMIT || '8' }}
          BIGMODEL_TRANSLATION_DAILY_LIMIT: ${{ vars.BIGMODEL_TRANSLATION_DAILY_LIMIT || '1000' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Prefer a capable multilingual model instead of the random free router.
          # The live zero-price catalog and persisted health override retired models.
          ARTICLE_TRANSLATION_MODEL: ${{ inputs.model || vars.ARTICLE_TRANSLATION_MODEL || 'qwen/qwen3.8-27b:free' }}
          ARTICLE_TRANSLATION_REQUEST_LIMIT: ${{ inputs.request_limit || '48' }}
          ARTICLE_TRANSLATION_DAILY_LIMIT: ${{ inputs.daily_limit || '1000' }}
          ARTICLE_TRANSLATION_INTERVAL: ${{ inputs.interval_seconds || '5' }}
          # Smaller responses are much more reliable on free models. The previous
          # 20-block batches frequently returned English or malformed/truncated JSON.
          ARTICLE_TRANSLATION_CHUNK_CHARS: "3500"
          ARTICLE_TRANSLATION_CHUNK_BLOCKS: "8"
        run: python scripts/translate_articles.py

      - name: Record failed or interrupted worker status
        if: ${{ !cancelled() }}
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          path = Path('data/translations/runtime.json')
          if path.exists():
              state = json.loads(path.read_text())
              if state.get('status') == 'running':
                  state.update(status='interrupted', finishedAt=datetime.now(timezone.utc).isoformat())
                  path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n')
          PYCODE

      - name: Validate translation sidecars
        id: validate_sidecars
        if: ${{ !cancelled() }}
        run: python scripts/validate_translations.py

      - name: Commit translation progress
        id: commit_progress
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/translations 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: translate important articles"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1

      - name: Continue productive budget-limited work
        if: ${{ !cancelled() && steps.commit_progress.outcome == 'success' && steps.validate_sidecars.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONTINUATION_INPUTS: ${{ toJSON(inputs) }}
        run: python scripts/continue_translation.py
