name: Sync article media to R2

# Uploads the article media that currently lives in the repository to the R2
# bucket. Run this once before switching <meta name="media-base"> on, and again
# whenever media needs backfilling outside the archive workflows.
#
# Safe to re-run: object keys are the repository-relative paths and file names
# are derived from a hash of the source URL, so an existing key is never
# replaced with different bytes.
#
# Served media is what the site reads, so this workflow only uploads. It never
# writes to the repository.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be uploaded"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: media-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify configuration
        run: |
          missing=""
          [ -n "$AWS_ACCESS_KEY_ID" ] || missing="$missing R2_ACCESS_KEY_ID"
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || missing="$missing R2_SECRET_ACCESS_KEY"
          [ -n "$R2_BUCKET" ] || missing="$missing R2_BUCKET"
          [ -n "$R2_ENDPOINT" ] || missing="$missing R2_ENDPOINT"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
          if [ ! -d data/article-media ]; then
            echo "::error::data/article-media is not present in the repository; nothing to upload"
            exit 1
          fi
          echo "Found $(find data/article-media -type f | wc -l) media files for s3://${R2_BUCKET}/"

      - name: Sync media to R2
        run: |
          aws --version
          args=(--only-show-errors)
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: no objects will be written"
            args+=(--dryrun)
          fi
          aws s3 sync data/article-media "s3://${R2_BUCKET}/" \
            --endpoint-url "$R2_ENDPOINT" --region auto "${args[@]}"

      - name: Report
        if: ${{ always() }}
        run: |
          {
            echo "### Article media sync"
            echo ""
            echo "- Bucket: \`${R2_BUCKET:-<unset>}\`"
            echo "- Endpoint: \`${R2_ENDPOINT:-<unset>}\`"
            echo "- Dry run: \`${DRY_RUN}\`"
          } >> "$GITHUB_STEP_SUMMARY"
