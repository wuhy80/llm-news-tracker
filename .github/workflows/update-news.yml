name: Update news

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/ai_review.py"
      - "tests/test_ai_model_selection.py"
      - "tests/test_ai_review.py"
      - "assets/**"
      - "index.html"
      - "article.html"
      - ".github/workflows/update-news.yml"
  schedule:
    # GitHub Actions cron uses UTC: 00:00/07:00 = 08:00/15:00 Asia/Shanghai.
    - cron: "0 0,7 * * *"
  workflow_dispatch:
    inputs:
      article_limit:
        description: "Maximum article snapshots to backfill"
        required: false
        default: "600"
      summary_limit:
        description: "Maximum Chinese summaries to generate"
        required: false
        default: "40"
      ai_review_limit:
        description: "Maximum articles to review with the configured model"
        required: false
        default: "240"

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and classify news
        run: python scripts/fetch_news.py

      - name: Archive readable articles
        env:
          ARTICLE_FETCH_LIMIT: ${{ inputs.article_limit || '300' }}
          ARTICLE_FETCH_WORKERS: "12"
          ARTICLE_READER_LIMIT: "10"
          ARTICLE_READER_DELAY: "6"
        run: python scripts/fetch_articles.py

      - name: Review new articles with a free model
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_REVIEW_PROVIDER: ${{ vars.AI_REVIEW_PROVIDER }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          AI_REVIEW_LIMIT: ${{ inputs.ai_review_limit || '120' }}
          AI_REVIEW_BATCH_SIZE: "8"
          AI_REVIEW_DELAY: "1"
        run: python scripts/ai_review.py

      - name: Generate Chinese summaries
        env:
          ARTICLE_SUMMARY_LIMIT: ${{ inputs.summary_limit || '20' }}
          ARTICLE_SUMMARY_DELAY: "1.5"
        run: python scripts/summarize_articles.py

      - name: Commit updated archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/articles
          git diff --cached --quiet || git commit -m "chore: update news archive"
          git push
