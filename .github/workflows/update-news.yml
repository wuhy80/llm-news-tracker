name: Update news

on:
  schedule:
    - cron: "15 4,12 * * *"
  workflow_dispatch:
    inputs:
      article_limit:
        description: "Maximum article snapshots to backfill"
        required: false
        default: "600"
      summary_limit:
        description: "Maximum Chinese summaries to generate"
        required: false
        default: "120"

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and classify news
        run: python scripts/fetch_news.py

      - name: Archive readable articles
        env:
          ARTICLE_FETCH_LIMIT: ${{ inputs.article_limit || '300' }}
          ARTICLE_FETCH_WORKERS: "12"
          ARTICLE_READER_LIMIT: "30"
          ARTICLE_READER_DELAY: "4"
        run: python scripts/fetch_articles.py

      - name: Generate Chinese summaries
        env:
          ARTICLE_SUMMARY_LIMIT: ${{ inputs.summary_limit || '60' }}
          ARTICLE_SUMMARY_DELAY: "0.35"
        run: python scripts/summarize_articles.py

      - name: Commit updated archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/articles
          git diff --cached --quiet || git commit -m "chore: update news archive"
          git push
