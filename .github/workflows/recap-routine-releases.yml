name: Re-cap routine release notes

# ai_review only revisits an item whose aiReview.version differs from the current
# one, so everything reviewed before the routine-release cap existed keeps its
# inflated level forever. Bumping REVIEW_VERSION would re-review the whole
# archive through the model; this applies the same cap locally instead, through
# the same cap_dimensions and level_for_score, at no cost.
#
# Dry run by default. Only data/articles/**/*.json is rewritten; the daily shards
# are rebuilt from those by the next update-news run.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the re-capped reviews (leave unchecked to report only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: media-maintenance
  cancel-in-progress: false

jobs:
  recap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APPLY: ${{ inputs.apply || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the recap script
        run: python -m unittest discover -s tests -p 'test_recap_routine_releases.py'

      - name: Report or apply the recap
        run: |
          if [ "$APPLY" = "true" ]; then
            python scripts/recap_routine_releases.py --apply
          else
            python scripts/recap_routine_releases.py
          fi

      - name: Commit the re-capped snapshots
        if: ${{ inputs.apply }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/articles
          if git diff --cached --quiet; then
            echo "Nothing to re-cap"
            exit 0
          fi
          git commit -m 'chore: re-cap routine release notes reviewed before the rule'
          # All automated archive writers share this concurrency group.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "Unable to push the re-capped snapshots" >&2
          exit 1
