name: Recompress screenshots to WebP

# PNG is lossless, which makes it the worst choice for a screenshot: the archive
# holds 113 MB of PNG across 636 files and WebP at quality 90 renders the same
# pixels in 45 MB.
#
# This is a lossy, one-way change to archived images. Nothing happens unless the
# apply input is checked, a file is left alone unless the converted copy is
# smaller, and deletion only touches the working tree, so git history keeps the
# original bytes.

on:
  workflow_dispatch:
    inputs:
      quality:
        description: "WebP quality 0-100 (higher = better fidelity, larger)"
        type: string
        default: "90"
      apply:
        description: "Write the WebP copies (leave unchecked to report only)"
        type: boolean
        default: false
      limit:
        description: "Only the N largest files (0 = all)"
        type: string
        default: "0"

permissions:
  contents: write

concurrency:
  # Deliberately not the shared archive-writes group: a run still pending there
  # is cancelled as soon as the every-five-minute translation job queues another
  # run, so a manual dispatch could never start. These maintenance jobs are rare
  # and their commit steps already rebase and retry against a moving main.
  group: media-maintenance
  cancel-in-progress: false

jobs:
  recompress:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APPLY: ${{ inputs.apply || 'false' }}
      QUALITY: ${{ inputs.quality || '90' }}
      LIMIT: ${{ inputs.limit || '0' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the recompression script
        run: python -m unittest discover -s tests -p 'test_recompress_images.py'

      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Report or apply WebP recompression
        run: |
          ARGS=(--quality "$QUALITY")
          if [ "$APPLY" = "true" ]; then
            ARGS+=(--apply)
          fi
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then
            ARGS+=(--limit "$LIMIT")
          fi
          python scripts/recompress_images.py "${ARGS[@]}"

      - name: Commit the recompressed media
        if: ${{ inputs.apply }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data
          if git diff --cached --quiet; then
            echo "Nothing to recompress"
            exit 0
          fi
          git commit -m 'chore: recompress screenshots to webp'
          # All automated archive writers share this concurrency group.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "Unable to push the recompressed media" >&2
          exit 1
